baseURL = "https://your-site.netlify.app/"
title = "Pengfei Chen"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[languages.en]
  label = "EN"
  locale = "en-US"
  weight = 1
  title = "Pengfei Chen · Sun Yat-sen University"

[languages.zh]
  label = "中文"
  locale = "zh-CN"
  weight = 2
  title = "陈鹏飞 · 中山大学"

[menus]
  [[menus.main]]
    identifier = "home"
    pageRef = "/"
    weight = 1
    [menus.main.params]
      icon = "home"
  [[menus.main]]
    identifier = "publications"
    pageRef = "/publications"
    weight = 2
    [menus.main.params]
      icon = "doc"
  [[menus.main]]
    identifier = "news"
    pageRef = "/news"
    weight = 3
    [menus.main.params]
      icon = "spark"
  [[menus.main]]
    identifier = "cv"
    pageRef = "/bio"
    weight = 4
    [menus.main.params]
      icon = "user"

[outputs]
  home = ["html"]
  section = ["html", "rss"]
  page = ["html"]

[pagination]
  pagerSize = 12

[markup.goldmark.renderer]
  unsafe = true

[imaging]
  resampleFilter = "lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82
