research:
  - icon: satellite
    title: Remote Sensing of Urban Environments
    text: Multi-sensor retrieval of land surface temperature, aerosols and land cover at fine spatiotemporal resolution.
  - icon: pulse
    title: Environmental Health & Exposure Science
    text: Spatiotemporal exposure assessment linking heat and air pollution to mortality and morbidity.
  - icon: globe
    title: Global Climate Change
    text: Climate-driven shifts in urban heat risk, adaptation capacity and nature-based solutions.
  - icon: grid
    title: Urban Vitality & GeoAI
    text: Deep learning on imagery, mobility and street-view data to characterize human activity in cities.

