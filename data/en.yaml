about: |
  I am an Associate Professor at the School of Geospatial Engineering and Science, Sun Yat-sen University.
  My research couples **Earth observation**, **spatial data science** and **epidemiological modeling** to
  quantify how environmental exposures in cities — heat, air pollution and green space — shape human health
  under a changing climate.

