bio_short: |
  I am an Associate Professor at the School of Remote Sensing Science and Technology, Sun Yat-sen University.
  I received my Ph.D. from Wuhan University and a joint Ph.D. from The Hong Kong Polytechnic University.
  My work spans **urban GIS**, **environmental health and exposure**, and **spatiotemporal data modeling**,
  with 30+ journal articles in *IJGIS*, *IEEE TGRS*, *IEEE T-ITS* and *Scientific Data*.
bio: |
  Pengfei Chen is an Associate Professor at the School of Remote Sensing Science and Technology, Sun Yat-sen University (SYSU).
  He received his B.Eng. (2012, with a minor B.Econ.), M.Sc. (2015) and Ph.D. (2019) from the School of Remote Sensing and Information
  Engineering, Wuhan University, and a Ph.D. (2020, joint program) from the Department of Land Surveying and Geo-Informatics,
  The Hong Kong Polytechnic University. He joined SYSU as an Assistant Professor in 2020 and has been an Associate Professor since 2023.

  His research spans urban GIS, environmental health and exposure, and spatiotemporal data modeling and analysis — including urban
  green-space serviceability and accessibility, urban vitality and human mobility, and reference-free accuracy assessment of global
  land cover products. He leads projects funded by the National Natural Science Foundation of China and the Guangdong Natural Science
  Foundation, and has published more than 30 articles in journals such as *International Journal of Geographical Information Science*,
  *IEEE Transactions on Geoscience and Remote Sensing*, *IEEE Transactions on Intelligent Transportation Systems* and *Scientific Data*.
  His honors include the Smart City Technology Innovation Award (Bronze Medal) from the International Society for Urban Informatics,
  First Prize in the SYSU Teaching Competition, and the Special Prize of the Surveying and Mapping Science and Technology Progress Award.

interests:
  - icon: grid
    title: Urban GIS
    text: Serviceability and accessibility of urban green space, urban vitality and resilience, and street-level greenery mapping.
  - icon: pulse
    title: Environmental Health & Exposure
    text: Exposure assessment integrating remote sensing and GIS, including urban eye-health risk, indoor transmission exposure and healthcare accessibility.
  - icon: route
    title: Spatiotemporal Data Modeling
    text: Trajectory uncertainty, individual location prediction and metro ridership forecasting with spatiotemporal deep learning.
  - icon: satellite
    title: Land Cover Data Quality
    text: Reference-free accuracy estimation and classification uncertainty of global land cover products.

