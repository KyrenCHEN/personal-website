description: 个人学术主页——地理信息科学、遥感、环境健康与城市气候。

about: |
  中山大学测绘科学与技术学院副教授、博士生导师。主要从事**对地观测**、**空间数据科学**与**环境流行病学**交叉研究，
  聚焦全球气候变化背景下城市高温、大气污染与绿色空间等环境暴露的时空格局及其健康效应。

  *占位文本——请替换为您的个人简介。*

research:
  - icon: satellite
    title: 城市环境遥感
    text: 多源遥感协同反演地表温度、气溶胶与土地覆盖，构建高时空分辨率城市环境数据集。
  - icon: pulse
    title: 环境健康与暴露评估
    text: 高温与大气污染的时空暴露评估及其与死亡、发病风险的关联研究。
  - icon: globe
    title: 全球气候变化
    text: 气候变化驱动下的城市热风险演变、适应能力与基于自然的解决方案。
  - icon: grid
    title: 城市活力与 GeoAI
    text: 融合影像、人群移动与街景数据的深度学习方法，刻画城市人类活动特征。

