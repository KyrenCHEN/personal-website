# Short bio on the homepage; full bio on the Biography page.
lede: 研究城市环境如何塑造人群暴露与健康，融合遥感、地理信息与时空数据。
bio_short: |
  陈鹏飞，中山大学遥感科学与技术学院副教授。武汉大学遥感信息工程学院工学博士，香港理工大学测绘与地理资讯学系哲学博士（联合培养）。
  主要从事**城市地理信息系统**、**环境健康与暴露**及**时空数据建模与分析**研究，在 *IJGIS*、*IEEE TGRS*、*IEEE T-ITS*、*Scientific Data* 等期刊发表学术论文 30 余篇。
bio: |
  陈鹏飞，中山大学遥感科学与技术学院副教授。2012 年获武汉大学遥感信息工程学院工学学士学位（辅修经济学学士），2015 年获该院理学硕士学位，
  2019 年获武汉大学工学博士学位，2020 年获香港理工大学测绘与地理资讯学系哲学博士学位（联合培养）。2020 年加入中山大学任助理教授，2023 年起任副教授。

  主要研究方向为城市地理信息系统、环境健康与暴露、时空数据建模与分析，重点关注城市绿地服务与可达性、城市活力与人群移动、
  全球地表覆盖数据无参考精度评估等问题。主持国家自然科学基金青年项目、广东省自然科学基金面上项目等科研项目，
  在 *International Journal of Geographical Information Science*、*IEEE Transactions on Geoscience and Remote Sensing*、
  *IEEE Transactions on Intelligent Transportation Systems*、*Scientific Data* 等期刊发表学术论文 30 余篇。
  曾获国际城市信息学会 Smart City Technology Innovation Award 铜奖、中山大学教师教学竞赛教学创新赛道一等奖、测绘科技进步奖特等奖等。

interests:
  - icon: grid
    title: 城市地理信息系统
    text: 城市绿地服务能力与可达性评价、城市活力与韧性、街景绿视率制图等城市空间分析问题。
  - icon: pulse
    title: 环境健康与暴露
    text: 融合遥感与地理信息技术的环境暴露评估，包括城市眼健康环境风险、室内传播暴露模拟与健康服务可达性。
  - icon: route
    title: 时空数据建模与分析
    text: 轨迹不确定性建模、个体位置预测、地铁客流预测等面向人群移动大数据的时空深度学习方法。
  - icon: satellite
    title: 地表覆盖数据质量评估
    text: 全球地表覆盖分类产品的无参考精度估计与分类不确定性分析。

