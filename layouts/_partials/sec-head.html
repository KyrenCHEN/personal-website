<header class="sec__head">
  {{- with .n }}<span class="sec__idx mono">{{ printf "%02d" . }}</span>{{ end }}
  <h2>{{ .title }}</h2>
  <span class="sec__rule" aria-hidden="true"></span>
  {{- with .more }}<a class="sec__more" href="{{ .url }}">{{ .label }} {{ partial "icon.html" "right" }}</a>{{ end }}
</header>
